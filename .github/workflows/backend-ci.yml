name: EPOS Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [discovery-server, api-gateway, auth-service, exam-service, scoring-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          if [ -d "microservices/${{ matrix.service }}" ]; then
            cd microservices/${{ matrix.service }}
            # We skip tests for the very first push because there are no DBs in GitHub yet
            mvn clean package -DskipTests 
          else
            echo "Service ${{ matrix.service }} not found, skipping."
          fi