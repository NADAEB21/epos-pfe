name: EPOS Backend CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # On teste les services fonctionnels qui ont des bases de données
        service: [auth-service, exam-service, scoring-service]

    # C'est ici qu'on lance la DB dans GitHub !
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: pfe_password
          # On cree la DB correspondant au service en cours
          POSTGRES_DB: ${{ matrix.service == 'auth-service' && 'auth_db' || (matrix.service == 'exam-service' && 'exam_db' || 'scoring_db') }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # ON ENLEVE -DskipTests pour que les tests tournent vraiment !
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=NADAEB21_epos-pfe \
            -Dsonar.organization=nadaeb21 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.moduleKey=${{ matrix.service }} \
            -pl :${{ matrix.service }} -am \
            -Dspring.profiles.active=test