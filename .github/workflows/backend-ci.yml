name: EPOS Backend CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # We include all services now
        service: [discovery-server, api-gateway, auth-service, exam-service, scoring-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          # EXPLANATION FOR DUMMY MODE:
          # We don't "cd" into the folder anymore. 
          # We stay at the root to use the Parent POM.
          # -pl :project-name tells Maven "Build ONLY this specific service"
          # -am tells Maven "Build any dependencies needed for this service"
          mvn clean package -DskipTests -pl :${{ matrix.service }} -am