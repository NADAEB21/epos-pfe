<!-- Fixed-viewport shell: the page itself never scrolls, only <main> does,
     so the sidebar always spans the full height instead of being capped at
     one viewport while long content runs past it.
     #405 — sous lg la barre latérale devient un tiroir (LayoutStore) ; le
     contenu est borné à max-w-7xl pour ne pas s'étirer sur un grand écran. -->
<div class="h-screen flex overflow-hidden">
  <app-sidebar class="hidden lg:block shrink-0 h-full" />

  @if (layout.sidebarOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <div class="absolute inset-0 bg-brand-900/50" (click)="layout.closeSidebar()"></div>
      <app-sidebar class="absolute inset-y-0 left-0 h-full shadow-pop" />
    </div>
  }

  <div class="flex-1 flex flex-col min-w-0">
    <app-topbar />
    <main class="flex-1 overflow-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
