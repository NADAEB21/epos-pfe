<aside class="w-64 min-h-screen bg-brand text-white flex flex-col">
  <div class="p-6 flex items-center gap-3 border-b border-white/10">
    <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center font-bold text-lg">
      E
    </div>
    <span class="font-semibold tracking-wide text-lg">EPOS</span>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-6 overflow-y-auto">
    @for (group of groups(); track group.title) {
      <div class="space-y-1">
        <p class="px-3 text-[10px] font-semibold uppercase tracking-wider text-white/40">
          {{ group.title }}
        </p>
        @for (item of group.items; track item.link) {
          <a [routerLink]="item.link" routerLinkActive="active" class="nav-link">
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    }
  </nav>
</aside>
