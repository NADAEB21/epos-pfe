<div class="profil-wrapper">
  <!-- HEADER DU PROFIL -->
  <div class="profile-header-card shadow-sm">
    <div class="avatar-large">
      {{ user?.prenom?.charAt(0) }}{{ user?.nom?.charAt(0) }}
    </div>
    <div class="user-meta">
      <h1>{{ user?.prenom }} {{ user?.nom }}</h1>
      <span class="role-badge">Super Administrateur</span>
      <p class="since">Membre depuis le {{ user?.createdAt | date:'longDate' }}</p>
    </div>
  </div>

  <div class="grid-sections">
    <!-- INFORMATIONS PERSONNELLES -->
    <div class="info-card shadow-sm">
      <h3>Informations personnelles</h3>
      <form [formGroup]="profilForm" (ngSubmit)="saveProfil()">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" formControlName="prenom">
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" formControlName="nom">
        </div>
        <div class="form-group">
          <label>Email (Non modifiable)</label>
          <input type="email" formControlName="email">
        </div>
        <button type="submit" class="btn-primary" [disabled]="profilForm.invalid">Enregistrer les modifications</button>
      </form>
    </div>

    <!-- SÉCURITÉ -->
    <div class="info-card shadow-sm">
      <h3>Sécurité du compte</h3>
      <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
        <p class="help-text">Changer votre mot de passe pour sécuriser votre accès.</p>
        <div class="form-group">
          <label>Ancien mot de passe</label>
          <input type="password" formControlName="oldPassword">
        </div>
        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <input type="password" formControlName="newPassword">
        </div>
        <button type="submit" class="btn-outline" [disabled]="passwordForm.invalid">Mettre à jour le mot de passe</button>
      </form>
    </div>
  </div>
</div>
