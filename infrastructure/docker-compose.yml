# EPOS — full local stack.
#
# All credentials are read from `.env` next to this file.
# See `.env.example` for the list of required variables.
#   cp .env.example .env   # then fill in real values
#   docker compose up -d   # builds images on first run
#
# Externally exposed: only the api-gateway (8080). postgres-db, pgAdmin and the
# Eureka dashboard are bound to 127.0.0.1 as dev conveniences; the application
# services have no host ports and are reachable only via the gateway.

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────
  postgres-db:
    image: postgres:16-alpine
    container_name: epos-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # #353/#359 — lus par init-db/init2-ai.sh (rôles ai_reader/ai_writer, base ai_db).
      - AI_READER_PASSWORD=${AI_READER_PASSWORD}
      - AI_WRITER_PASSWORD=${AI_WRITER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - epos-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: epos-pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres-db
    networks:
      - epos-network

  # ─── Service discovery ───────────────────────────────────────────────────
  discovery-server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: discovery-server
    image: epos/discovery-server
    container_name: epos-discovery-server
    # Eureka dashboard on loopback only — dev convenience, not externally exposed.
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_HOSTNAME=discovery-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - epos-network

  # ─── API gateway — the only externally exposed service ───────────────────
  api-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    image: epos/api-gateway
    container_name: epos-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      # Comma-separated list of allowed CORS origins.
      # Angular dashboard runs on :4200, Flutter Web on :4300.
      # Add further origins here without touching application code.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - epos-network

  # ─── Application services — internal only (reachable via the gateway) ────
  auth-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    image: epos/auth-service
    container_name: epos-auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/auth_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      # envoi réel des emails de réinitialisation de mot de passe ──
      # MAIL_ENABLED=false (défaut) → StubEmailService, rien n'est envoyé.
      # MAIL_ENABLED=true            → SpringMailEmailService, SMTP réel requis.
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_FROM=${MAIL_FROM:-noreply@epos.tn}
      - MAIL_RESET_BASE_URL=${MAIL_RESET_BASE_URL:-http://localhost:4200/reset-password}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-smtp.gmail.com}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_APP_PASSWORD=${MAIL_APP_PASSWORD:-}
    depends_on:
      postgres-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - epos-network

  exam-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: exam-service
    image: epos/exam-service
    container_name: epos-exam-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/exam_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      # Zone applicative (ADR-0010). Le conteneur tourne UTC ; on épingle la zone
      # de l'examen pour que launched_at/paused_at s'alignent sur l'horloge murale
      # locale comparée au planning. Override : APP_TIMEZONE dans .env.
      - APP_TIMEZONE=${APP_TIMEZONE:-Africa/Tunis}
      - TZ=${APP_TIMEZONE:-Africa/Tunis}
    depends_on:
      postgres-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - epos-network

  scoring-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: scoring-service
    image: epos/scoring-service
    container_name: epos-scoring-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/scoring_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      # Cross-service reads (rotation generation, cross-grille notation validation)
      # call exam-service by its compose service name on the internal network.
      # Without this the WebClient falls back to localhost:8082 (the scoring
      # container itself) and every cross-service call fails "injoignable".
      - EXAM_SERVICE_BASE_URL=http://exam-service:8082
      # Cohérence de zone (ADR-0010) : scoring ne stampe pas "now" dans la formule
      # de temps effectif, mais on aligne la zone OS pour les logs et tout appel
      # éventuel à now(). Le planning (debutCreneau) reste ancré sur launched_at.
      - TZ=${APP_TIMEZONE:-Africa/Tunis}
      # #227 — envoi des convocations aux étudiants. DÉSACTIVÉ par défaut : sans
      # ce garde-fou, un `docker compose up` sur une copie des données réelles
      # enverrait de vrais e-mails à de vrais étudiants. Renseigner MAIL_ENABLED
      # + un compte SMTP dans infrastructure/.env pour envoyer réellement.
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_FROM=${MAIL_FROM:-noreply@epos.tn}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-smtp.gmail.com}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_APP_PASSWORD=${MAIL_APP_PASSWORD:-}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-true}
      - MAIL_SMTP_STARTTLS=${MAIL_SMTP_STARTTLS:-true}
    depends_on:
      postgres-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - epos-network

  # ─── Module IA/BI (#352, ADR-0029) — interne uniquement ──────────────────
  # Pas de port hôte : joignable seulement via le gateway (/api/v1/ai/**).
  # Lecture seule sur scoring_db/exam_db par le rôle ai_reader (#353) ; le
  # healthcheck vit dans le Dockerfile (python urllib — pas de curl en slim).
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    image: epos/ai-service
    container_name: epos-ai-service
    environment:
      - AI_SCORING_DSN=host=postgres-db port=5432 dbname=scoring_db user=ai_reader password=${AI_READER_PASSWORD}
      - AI_EXAM_DSN=host=postgres-db port=5432 dbname=exam_db user=ai_reader password=${AI_READER_PASSWORD}
      # #359 — cache des indices + journal : ai_writer n'a AUCUN droit hors ai_db.
      - AI_DB_DSN=host=postgres-db port=5432 dbname=ai_db user=ai_writer password=${AI_WRITER_PASSWORD}
      - TZ=${APP_TIMEZONE:-Africa/Tunis}
    # Budget mémoire d'ADR-0029 D7 (poste facultaire + AWS t3).
    mem_limit: 512m
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - epos-network

networks:
  epos-network:
    driver: bridge

volumes:
  postgres_data: