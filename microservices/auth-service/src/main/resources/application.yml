server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:pfe_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # Schema is owned by Flyway (db/migration/V*.sql), matching exam-service and
  # scoring-service. Add a column by writing V<n>__*.sql — never by editing
  # init.sql or a previously applied migration.
  flyway:
    enabled: true
    # Every database that predates this config (team dev volumes, the AWS
    # deployment) already carries the V1 schema, created by init.sql. Without a
    # baseline Flyway aborts on a non-empty schema that has no history table.
    # baseline-version=1 records those databases as already at V1 and skips it,
    # so only V2 onwards run. A genuinely empty database is unaffected and gets
    # built from V1. exam/scoring need none of this — their schemas were empty
    # from the start.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway builds the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # Async executor for AuditService
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500
      thread-name-prefix: audit-

  # ─── SMTP sortant (BF1.3) ─────────────────────────────────────────────────
  # Actif seulement si app.mail.enabled=true (voir bloc "app" plus bas).
  # Ce bloc est lu par Spring Boot pour auto-configurer le bean JavaMailSender
  # que SpringMailEmailService utilise. Sans lui, activer app.mail.enabled ne
  # suffit pas : JavaMailSender resterait absent du contexte.
  #
  # Test rapide de connectivité avant une démo (le port 587 est parfois bloqué
  # par un pare-feu institutionnel) :
  #   nc -vz smtp.gmail.com 587      (Linux/Mac)
  #   Test-NetConnection smtp.gmail.com -Port 587   (PowerShell)
  mail:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  # MUST be set via env. Minimum 32 bytes (256 bits) for HS256.
  # No default — application fails fast at startup if JWT_SECRET is missing.
  secret: ${JWT_SECRET:}
  # #306 (filet A) — 4 h au lieu de 24 h : borne le pire cas si la liste de
  # révocation venait à défaillir. PAS plus court : le renouvellement passe par
  # le refresh silencieux (mobile: _JwtInterceptor sur 401 ; refresh token 7 j),
  # et un TTL trop agressif fabriquerait des déconnexions en pleine station sur
  # le Wi-Fi de la faculté (avertissement ADR-0023). Surchargeable par env.
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:14400000}    # 4 h
  refresh-token-expiry-ms: 604800000  # 7 days

# ─── Password hashing ─────────────────────────────────────────────────────────
security:
  bcrypt:
    # OWASP recommends ≥ 12 for current hardware (~250–400 ms / hash).
    # Lower values (e.g. 4) are intended for fast test/CI runs only.
    cost: ${BCRYPT_COST:12}

# ─── Outbound mail ────────────────────────────────────────────────────────────
# When app.mail.enabled=false (default), StubEmailService is wired and nothing
# is sent over SMTP. Enable in production (et pour les démos avec de vrais
# utilisateurs) et supply spring.mail.* + reset-base-url ci-dessus pour que
# les liens de réinitialisation pointent vers le frontend réel.
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@epos.tn}
    reset-base-url: ${MAIL_RESET_BASE_URL:http://localhost:4200/reset-password}
# CORS is owned by api-gateway. Per-service CORS was removed because the second
# layer doubled Access-Control-Allow-Origin on routed responses.

# ─── Eureka ───────────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # #255 — spring-boot-starter-mail ajoute un health indicator qui OUVRE une
    # connexion SMTP à chaque sonde. La messagerie est désactivée par défaut
    # (app.mail.enabled=false), donc la sonde échoue, /actuator/health renvoie
    # 503, et le conteneur reste marqué « unhealthy » en permanence — alors que
    # le service fonctionne parfaitement. docker-compose refuse alors de démarrer
    # ce qui en dépend, et l'état du stack ment au premier coup d'œil.
    # La santé de l'auth ne doit pas dépendre d'un SMTP qu'on a volontairement
    # éteint : l'envoi d'e-mails n'est pas sur le chemin critique du login.
    mail:
      enabled: false

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    tn.epos.auth_service: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN