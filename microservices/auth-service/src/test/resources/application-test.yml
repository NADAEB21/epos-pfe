spring:
  # In-memory H2 in PostgreSQL-compatibility mode — tests must NEVER touch the
  # real dev/CI auth_db. (Previously this pointed at jdbc:postgresql://localhost/auth_db
  # with ddl-auto=create-drop, which dropped every table in the live database on
  # test teardown.) Mirrors scoring-service / exam-service application-test.properties.
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Tests build the schema from the JPA entities (ddl-auto below), so Flyway is
  # off here: the migrations are Postgres-specific (BIGSERIAL, a functional
  # UNIQUE INDEX over COALESCE) and would not all run on H2, even in
  # PostgreSQL-compatibility mode.
  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        # Stop Hibernate probing the real DB metadata at startup.
        temp:
          use_jdbc_metadata_defaults: false
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1jaS10ZXN0aW5nLW9ubHk=
  expiration: 86400000
  refresh-expiration: 604800000

app:
  mail:
    enabled: false
    reset-base-url: http://test-frontend/reset-password
  cors:
    allowed-origins: http://localhost:4200,https://epos.example.com

security:
  bcrypt:
    cost: 4

logging:
  level:
    tn.epos.auth_service: INFO
