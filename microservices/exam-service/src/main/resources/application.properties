server.port=8082
spring.application.name=exam-service

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/exam_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:pfe_password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway owns the schema; Hibernate only validates entities match.
spring.flyway.enabled=true
# {vendor} : migrations réservées à un moteur (db/vendor/postgresql — GRANT,
# DO $$...). HORS de db/migration exprès : Flyway scanne récursivement, un
# sous-dossier serait vu aussi par le H2 des tests. Sous H2, db/vendor/h2
# n'existe pas et est ignoré (fail-on-missing-locations false par défaut).
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.baseline-on-migrate=false

# Upload PDF
epos.upload.dir=uploads/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.postgresql=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Zone applicative (ADR-0010, option A). L'horloge injectée stampe launched_at /
# paused_at dans cette zone — l'examen est un évènement local (faculté de
# Monastir). Override par déploiement via APP_TIMEZONE (ex. pour aligner sur la
# zone d'un poste de dev qui n'est pas en Africa/Tunis).
app.timezone=${APP_TIMEZONE:Africa/Tunis}

# MUST be set via env. Minimum 32 bytes (256 bits) for HS256.
# No default — SecurityConfig fails fast at startup if JWT_SECRET is missing.
jwt.secret=${JWT_SECRET:}

# CORS is owned by api-gateway. Per-service CORS was removed because the second
# layer doubled Access-Control-Allow-Origin on routed responses.

# Pagination
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Actuator — only health + info are web-exposed; /actuator/health is public
# (SecurityConfig permitAll) so docker-compose and Eureka can probe it.
management.endpoints.web.exposure.include=health,info