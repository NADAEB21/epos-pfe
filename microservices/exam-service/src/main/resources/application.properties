server.port=8082
spring.application.name=exam-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/exam_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:pfe_password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway owns the schema; Hibernate only validates entities match.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Upload PDF
epos.upload.dir=uploads/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.postgresql=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# MUST be set via env. Minimum 32 bytes (256 bits) for HS256.
# No default — SecurityConfig fails fast at startup if JWT_SECRET is missing.
jwt.secret=${JWT_SECRET:}

# CORS allowed origins (comma-separated). Empty = deny every cross-origin request.
# Production: set CORS_ALLOWED_ORIGINS to the frontend URL(s), e.g. https://epos.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Pagination
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Actuator — only health + info are web-exposed; /actuator/health is public
# (SecurityConfig permitAll) so docker-compose and Eureka can probe it.
management.endpoints.web.exposure.include=health,info