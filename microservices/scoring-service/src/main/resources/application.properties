server.port=8083
spring.application.name=scoring-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/scoring_db
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:pfe_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# replace 'validate' with 'update' to run locally
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 

jwt.secret=${JWT_SECRET:change-me-in-production-must-be-32-chars!!}
