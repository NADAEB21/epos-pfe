server.port=8083
spring.application.name=scoring-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/scoring_db
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:pfe_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# MUST be set via env. Minimum 32 bytes (256 bits) for HS256.
# No default - SecurityConfig fails fast at startup if JWT_SECRET is missing.
jwt.secret=${JWT_SECRET:}

# CORS allowed origins (comma-separated). Empty = deny every cross-origin request.
# Production: set CORS_ALLOWED_ORIGINS to the frontend URL(s), e.g. https://epos.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

