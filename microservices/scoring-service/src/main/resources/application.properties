server.port=8083
spring.application.name=scoring-service

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/scoring_db
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:pfe_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# MUST be set via env. Minimum 32 bytes (256 bits) for HS256.
# No default - SecurityConfig fails fast at startup if JWT_SECRET is missing.
jwt.secret=${JWT_SECRET:}

# CORS is owned by api-gateway. Per-service CORS was removed because the second
# layer doubled Access-Control-Allow-Origin on routed responses.

# Actuator — only health + info are web-exposed; /actuator/health is public
# (SecurityConfig permitAll) so docker-compose and Eureka can probe it.
management.endpoints.web.exposure.include=health,info

# ⚠️ #255 — spring-boot-starter-mail ajoute un health indicator qui OUVRE une
# connexion SMTP à chaque sonde. Messagerie désactivée (le défaut) => la sonde
# échoue => /actuator/health renvoie 503 => le conteneur est marqué unhealthy en
# permanence et docker-compose refuse de démarrer ce qui en dépend. C'est très
# exactement le bug déjà constaté sur l'auth-service (#255). La santé du scoring
# ne doit pas dépendre d'un SMTP qu'on a volontairement éteint.
management.health.mail.enabled=false

# Exam-service base URL — used by ExamServiceClient for #84 cross-grille
# validation. Local dev: http://localhost:8082. Docker compose: http://exam-service:8082.
exam-service.base-url=${EXAM_SERVICE_BASE_URL:http://localhost:8082}

# ─── Convocations par e-mail (#227) ───────────────────────────────────────────
# DÉSACTIVÉ PAR DÉFAUT, volontairement : sans ce garde-fou, une démo ou un
# `docker compose up` sur des données réelles enverrait de vrais e-mails à de
# vrais étudiants. À false, StubConvocationEmailService capture les envois en
# mémoire (rien ne part) et l'API répond honnêtement « simulé ».
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@epos.tn}
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Zone policy (ADR-0010 option A). Pin the injectable Clock to the exam region's
# zone so machine-stamped moments (paused_at) and the user-entered schedule
# (Rotation.debutCreneau) are compared in one zone. Override per-deploy with
# APP_TIMEZONE (e.g. to match a dev host). See ClockConfig + ADR-0012 §0.
app.timezone=${APP_TIMEZONE:Africa/Tunis}

